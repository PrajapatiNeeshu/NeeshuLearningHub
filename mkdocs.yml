site_name: Neeshu Learning Hub
site_description: Professional learning portal for QA automation engineers
site_author: Neeshu Kumar
site_url: https://PrajapatiNeeshu.github.io/NeeshuLearningHub/
repo_url: https://github.com/PrajapatiNeeshu/NeeshuLearningHub
repo_name: GitHub Repository
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    # Dark theme (default)
    - scheme: slate
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-7
        name: 🌙 Switch to light mode
    # Light theme
    - scheme: default
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-4
        name: ☀️ Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.loading
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - toc.integrate
    - toc.follow
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tooltips
    - search.highlight
    - search.suggest
    - search.share
    - header.autohide
    - announce.dismiss
markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
      auto_title: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
plugins:
  - search:
      lang: en
      pipeline:
        - stemmer
        - stopWordFilter
  - glightbox:
      skip_classes:
        - no-lightbox
  - mermaid2
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PrajapatiNeeshu
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/neeshukumar
      name: LinkedIn
    - icon: fontawesome/solid/envelope
      link: mailto:neeshulwc@gmail.com
      name: Email
  generator: false
extra_css:
  - assets/stylesheets/custom.css
